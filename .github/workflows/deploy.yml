name: Build and Deploy

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            set -e
            WEBHOOK="${{ secrets.DISCORD_WEBHOOK }}"
            PROJECT_DIR="/var/www/be-go-flush"
            TEMP_DIR="/var/www/be-go-flush_temp"

            # Функция безопасной отправки в Discord
            send_discord() {
              curl -k -H "Content-Type: application/json" -X POST -d "$1" "$WEBHOOK" || echo "Warning: Discord notification failed."
            }

            send_discord '{"content": "🚀 **Deployment started for be-go-flush...**"}'

            # 1. Build
            mkdir -p $PROJECT_DIR
            rm -rf $TEMP_DIR
            git clone https://github.com/caseapia/be-go-flush.git $TEMP_DIR
            cd $TEMP_DIR

            MAIN_PATH=$(find . -name "main.go" -print -quit)
            /usr/bin/go mod tidy
            /usr/bin/go build -o server_bin $MAIN_PATH

            # 2. Deploy
            mv server_bin $PROJECT_DIR/server_bin
            chmod +x $PROJECT_DIR/server_bin
            rm -rf $TEMP_DIR

            cd $PROJECT_DIR
            find . -maxdepth 1 ! -name 'server_bin' ! -name '.env' ! -name 'log.txt' ! -name '.' -exec rm -rf {} +

            # 3. Restart
            systemctl restart gobackend

            # 4. Metrics
            sleep 3
            PID=$(pgrep -f server_bin | head -n 1)
            CPU=$(ps -p $PID -o %cpu --no-headers | xargs)
            MEM=$(ps -p $PID -o rss --no-headers | awk '{printf "%.2f MB", $1/1024}')
            UPTIME=$(ps -p $PID -o etime --no-headers | xargs)

            # Формируем JSON через переменные для надежности
            PAYLOAD=$(printf '{"embeds": [{"title": "✅ Deployment Successful", "color": 5025616, "fields": [{"name": "PID", "value": "%s", "inline": true}, {"name": "CPU", "value": "%s%%", "inline": true}, {"name": "RAM", "value": "%s", "inline": true}, {"name": "Uptime", "value": "%s", "inline": true}]}]}' "$PID" "$CPU" "$MEM" "$UPTIME")

            send_discord "$PAYLOAD"
