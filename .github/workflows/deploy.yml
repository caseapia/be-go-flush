name: Build and Deploy

on:
  push:
    branches: [master] # Убедись, что ветка называется master, а не main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USERNAME}}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            set -e # Остановить выполнение при любой ошибке

            PROJECT_DIR="/var/www/be-go-flush"
            mkdir -p $PROJECT_DIR
            cd $PROJECT_DIR

            # 1. Обновляем код
            if [ -d ".git" ]; then
              git fetch --all
              git reset --hard origin/master
            else
              git clone https://github.com/caseapia/be-go-flush.git .
            fi

            # 2. Установка зависимостей и билд
            # Если main.go лежит в корне, используем '.', если нет - укажи путь
            /usr/bin/go mod tidy
            /usr/bin/go build -o server_bin .

            # 3. Очистка (удаляем всё кроме бинарника и .env)
            # Мы используем временный файл, чтобы find не удалил сам себя в процессе
            find . -maxdepth 1 ! -name 'server_bin' ! -name '.env' ! -name '.' -exec rm -rf {} +

            # 4. Перезапуск сервиса (Systemd)
            systemctl restart gobackend
