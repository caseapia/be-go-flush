name: Deploy to Production

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      debug:
        description: "Enable debug mode"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

env:
  GO_VERSION: "1.22"
  BINARY_NAME: flush-api

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Notify Discord - Start
        run: |
          curl -s -X POST "${{ secrets.DISCORD_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"embeds\": [{
                \"title\": \"🚀 Pipeline Started\",
                \"color\": 3447003,
                \"description\": \"Building and testing the new changes.\",
                \"fields\": [
                  { \"name\": \"👤 Author\", \"value\": \"${{ github.actor }}\", \"inline\": true },
                  { \"name\": \"📝 Commit\", \"value\": \"\`${{ github.sha }}\`\", \"inline\": true }
                ]
              }]
            }"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run tests
        id: test_run
        run: go test -v ./...

      - name: Notify Discord - Test Results
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            TITLE="✅ Tests Passed"
            COLOR=3066993
            DESC="All tests completed successfully."
          else
            TITLE="❌ Tests Failed"
            COLOR=15158332
            DESC="Some tests failed. Check the action logs."
          fi
          curl -s -X POST "${{ secrets.DISCORD_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"embeds\": [{
                \"title\": \"$TITLE\",
                \"description\": \"$DESC\",
                \"color\": $COLOR,
                \"url\": \"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"
              }]
            }"

  deploy:
    name: Deploy
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -ldflags='-s -w -extldflags "-static"' \
            -o ${{ env.BINARY_NAME }} ./cmd/app/

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo '${{ secrets.DEPLOY_SSH_KEY }}' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.DEPLOY_PORT }} -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Upload binary
        run: |
          scp -P ${{ secrets.DEPLOY_PORT }} -i ~/.ssh/deploy_key \
            ${{ env.BINARY_NAME }} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/tmp/flush-api-new

      - name: Deploy and restart service
        id: deploy_step
        run: |
          ssh -p ${{ secrets.DEPLOY_PORT }} -i ~/.ssh/deploy_key \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            'bash -s' << 'ENDSSH'
          set -e
          sudo systemctl stop flush-api
          [ -f /opt/flush/bin/flush-api ] && cp /opt/flush/bin/flush-api /opt/flush/bin/flush-api.bak
          mv /tmp/flush-api-new /opt/flush/bin/flush-api
          chmod 750 /opt/flush/bin/flush-api

          if [ "${{ github.event.inputs.debug }}" = "true" ]; then
            sudo sed -i 's|^ExecStart=.*|ExecStart=/opt/flush/bin/flush-api -debug|' /etc/systemd/system/flush-api.service
            LOG_TYPE="debug"
          else
            sudo sed -i 's|^ExecStart=.*|ExecStart=/opt/flush/bin/flush-api|' /etc/systemd/system/flush-api.service
            LOG_TYPE="default"
          fi

          sudo systemctl daemon-reload
          sudo systemctl start flush-api
          sleep 5

          echo "cpu_load=$(top -bn1 | grep 'Cpu(s)' | sed 's/.*, *\([0-9.]*\)%* id.*/\1/' | awk '{print 100 - $1"%"}')"
          echo "mem_usage=$(free -m | awk '/Mem:/ { printf "%d/%dMB (%.2f%%)", $3, $2, $3*100/$2 }')"
          echo "disk_usage=$(df -h / | awk 'NR==2 {print $5}')"
          echo "uptime=$(uptime -p)"
          echo "process_mem=$(ps -u ${{ secrets.DEPLOY_USER }} -o rss,command | grep '${{ env.BINARY_NAME }}' | grep -v grep | awk '{printf "%.2f MB", $1/1024}')"
          echo "logging_type=$LOG_TYPE"
          ENDSSH | tee -a $GITHUB_OUTPUT

      - name: Notify Discord - Success
        if: success()
        run: |
          STATS_FIELD="📊 **CPU:** ${{ steps.deploy_step.outputs.cpu_load }} | **Disk:** ${{ steps.deploy_step.outputs.disk_usage }}\n🧠 **RAM:** ${{ steps.deploy_step.outputs.mem_usage }}\n💎 **App RAM:** ${{ steps.deploy_step.outputs.process_mem }}\n⏱️ **Uptime:** ${{ steps.deploy_step.outputs.uptime }}"
          LOG_TYPE="${{ steps.deploy_step.outputs.logging_type }}"

          COMMIT_MSG=$(echo "${{ github.event.head_commit.message }}" | head -1)

          curl -s -X POST "${{ secrets.DISCORD_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"embeds\": [{
                \"title\": \"✅ Deploy Successful\",
                \"color\": 3066993,
                \"fields\": [
                  { \"name\": \"🌐 Service\", \"value\": \"api.dontkillme.lol\", \"inline\": true },
                  { \"name\": \"🛠️ Logging Type\", \"value\": \"$LOG_TYPE\", \"inline\": true },
                  { \"name\": \"👤 Author\", \"value\": \"${{ github.actor }}\", \"inline\": true },
                  { \"name\": \"📈 Server Status\", \"value\": \"$STATS_FIELD\", \"inline\": false },
                  { \"name\": \"📝 Commit\", \"value\": \"\`${{ github.sha }}\` $COMMIT_MSG\", \"inline\": false }
                ],
                \"footer\": { \"text\": \"${{ github.repository }}\" },
                \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
              }]
            }"

      - name: Notify Discord - Failure
        if: failure()
        run: |
          curl -s -X POST "${{ secrets.DISCORD_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"content\": \"<@531462564304125962>\",
              \"embeds\": [{
                \"title\": \"❌ Deployment Failed\",
                \"color\": 15158332,
                \"description\": \"The deployment process encountered an error.\",
                \"fields\": [
                  { \"name\": \"🔗 Run Link\", \"value\": \"[View Action Logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})\", \"inline\": false }
                ]
              }]
            }"

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
