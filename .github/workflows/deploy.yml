name: Deploy to Production

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      debug:
        description: "Enable debug mode"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

env:
  GO_VERSION: "1.22"
  BINARY_NAME: flush-api

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run tests
        run: go test -v ./...

  deploy:
    name: Deploy
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -ldflags='-s -w -extldflags "-static"' \
            -o ${{ env.BINARY_NAME }} ./cmd/app/

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo '${{ secrets.DEPLOY_SSH_KEY }}' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.DEPLOY_PORT }} \
            -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Upload binary
        run: |
          scp -P ${{ secrets.DEPLOY_PORT }} \
              -i ~/.ssh/deploy_key \
              ${{ env.BINARY_NAME }} \
              ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/tmp/flush-api-new

      - name: Deploy and restart service
        id: deploy
        run: |
          ssh -p ${{ secrets.DEPLOY_PORT }} \
              -i ~/.ssh/deploy_key \
              ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
              'bash -s' << 'ENDSSH'
            set -e

            sudo systemctl stop flush-api

            if [ -f /opt/flush/bin/flush-api ]; then
              cp /opt/flush/bin/flush-api /opt/flush/bin/flush-api.bak
            fi

            mv /tmp/flush-api-new /opt/flush/bin/flush-api
            chmod 750 /opt/flush/bin/flush-api

            if [ "$DEBUG_MODE" = "true" ]; then
              sudo sed -i 's|^ExecStart=.*|ExecStart=/opt/flush/bin/flush-api -debug|' /etc/systemd/system/flush-api.service
              echo "Starting in DEBUG mode"
            else
              sudo sed -i 's|^ExecStart=.*|ExecStart=/opt/flush/bin/flush-api|' /etc/systemd/system/flush-api.service
              echo "Starting in PRODUCTION mode"
            fi

            sudo systemctl daemon-reload
            sudo systemctl start flush-api

            sleep 10
            STATUS=$(sudo systemctl is-active flush-api)
            echo "Service status: $STATUS"
            
            if [ "$STATUS" != "active" ]; then
              echo 'Deployment failed, rolling back...'
              echo '--- Error logs ---'
              sudo journalctl -u flush-api -n 30 --no-pager
              cp /opt/flush/bin/flush-api.bak /opt/flush/bin/flush-api
              sudo systemctl start flush-api
              exit 1
            fi

            echo ''
            echo '======================================='
            echo '   DEPLOY SUCCESSFUL'
            echo '======================================='
            echo ''
            echo '--- Process info ---'
            sudo systemctl status flush-api --no-pager -l
            echo ''
            echo '--- Last 20 lines of logs ---'
            sudo journalctl -u flush-api -n 20 --no-pager
            echo ''
            echo '--- Useful commands ---'
            echo 'View logs live:    sudo journalctl -u flush-api -f'
            echo 'View logs (last):  sudo journalctl -u flush-api -n 50 --no-pager'
            echo 'Service status:    sudo systemctl status flush-api'
            echo 'Restart service:   sudo systemctl restart flush-api'
            echo '======================================='
          ENDSSH

      - name: Notify Discord - Success
        if: success()
        run: |
          COMMIT_MSG=$(echo "${{ github.event.head_commit.message }}" | head -1)
          COMMIT_SHA="${{ github.sha }}"
          ACTOR="${{ github.actor }}"
          REPO="${{ github.repository }}"
          RUN_URL="https://github.com/$REPO/actions/runs/${{ github.run_id }}"

          curl -s -X POST "https://discord.com/api/webhooks/1469429197197017089/a8kJUQnFkTaKGAW8DZbeQSkAlPvCZpbH4MKg5AZEwYRF2zOI3T-9P2tEKVjalhJ48mqR" \
            -H "Content-Type: application/json" \
            -d "{
              \"embeds\": [{
                \"title\": \"✅ Deploy Successful\",
                \"color\": 3066993,
                \"fields\": [
                  { \"name\": \"🌐 Service\", \"value\": \"api.dontkillme.lol\", \"inline\": true },
                  { \"name\": \"👤 Author\", \"value\": \"$ACTOR\", \"inline\": true },
                  { \"name\": \"📝 Commit\", \"value\": \"\`${COMMIT_SHA:0:7}\` $COMMIT_MSG\", \"inline\": false },
                  { \"name\": \"🔗 Actions\", \"value\": \"[View Run]($RUN_URL)\", \"inline\": false }
                ],
                \"footer\": { \"text\": \"$REPO\" },
                \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
              }]
            }"

      - name: Notify Discord - Failure
        if: failure()
        run: |
          COMMIT_MSG=$(echo "${{ github.event.head_commit.message }}" | head -1)
          COMMIT_SHA="${{ github.sha }}"
          ACTOR="${{ github.actor }}"
          REPO="${{ github.repository }}"
          RUN_URL="https://github.com/$REPO/actions/runs/${{ github.run_id }}"

          curl -s -X POST "${{ secrets.DISCORD_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"embeds\": [{
                \"title\": \"❌ Deploy Failed\",
                \"color\": 15158332,
                \"fields\": [
                  { \"name\": \"🌐 Service\", \"value\": \"api.dontkillme.lol\", \"inline\": true },
                  { \"name\": \"👤 Author\", \"value\": \"$ACTOR\", \"inline\": true },
                  { \"name\": \"📝 Commit\", \"value\": \"\`${COMMIT_SHA:0:7}\` $COMMIT_MSG\", \"inline\": false },
                  { \"name\": \"🔗 Actions\", \"value\": \"[View Run]($RUN_URL)\", \"inline\": false }
                ],
                \"footer\": { \"text\": \"$REPO\" },
                \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
              }]
            }"

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
