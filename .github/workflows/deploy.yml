name: Build and Deploy

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            set -e
            PROJECT_DIR="/var/www/be-go-flush"
            TEMP_DIR="/var/www/be-go-flush_temp"

            mkdir -p $PROJECT_DIR

            # 1. Клонируем во временную папку, чтобы не было конфликтов с бинарником
            rm -rf $TEMP_DIR
            git clone https://github.com/caseapia/be-go-flush.git $TEMP_DIR

            # 2. Переходим в темп и билдим
            cd $TEMP_DIR
            /usr/bin/go mod tidy
            /usr/bin/go build -o server_bin .

            # 3. Переносим бинарник в основную папку
            mv server_bin $PROJECT_DIR/server_bin

            # 4. Очистка: удаляем исходники (темп-папку)
            rm -rf $TEMP_DIR

            # 5. В основной папке оставляем ТОЛЬКО бинарник и .env
            cd $PROJECT_DIR
            find . -maxdepth 1 ! -name 'server_bin' ! -name '.env' ! -name 'log.txt' ! -name '.' -exec rm -rf {} +

            # 6. Перезапуск сервиса
            systemctl restart gobackend
